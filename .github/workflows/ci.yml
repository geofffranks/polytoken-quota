name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAPID_CHECKS: '100'
      RAPID_SEED: '1'
      RAPID_SHRINKTIME: '10s'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Go version
        shell: bash
        run: |
          expected="go$(awk '$1 == "go" { print $2; exit }' go.mod)"
          actual="$(go env GOVERSION)"
          test "$actual" = "$expected" || {
            echo "expected $expected, got $actual" >&2
            exit 1
          }
      - name: Test
        run: go test ./... -count=1 -timeout=5m
      - name: Race test
        run: go test -race ./... -count=1 -timeout=10m
      - name: Retain synthetic Rapid failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapid-failures
          path: '**/testdata/rapid/**/*.fail'
          if-no-files-found: ignore
          retention-days: 7
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Workflow and reporter policy fixtures
        run: |
          scripts/test-workflows.sh
          bash scripts/test-property-report.sh
      - name: SwiftBar plugin fixture tests
        run: swiftbar/tests/run_tests.sh
