name: Weekly Patch Release

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-patch-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select release and check for changes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tags_tmp=$(mktemp)
          trap 'rm -f "$tags_tmp"' EXIT
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' > "$tags_tmp"
          git tag --list >> "$tags_tmp"
          latest=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' "$tags_tmp" | sort -V | tail -n1 || true)
          if [[ -z "$latest" ]]; then
            echo 'Refusing to create the first release: no existing stable vX.Y.Z release or tag was found.' >&2
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/$latest" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$latest:refs/tags/$latest"
          fi
          commits=$(git rev-list --count "$latest..HEAD")
          if [[ "$commits" -eq 0 ]]; then
            echo "No commits since $latest; skipping weekly patch release."
            exit 0
          fi
          version=${latest#v}
          IFS=. read -r major minor patch <<< "$version"
          next="v${major}.${minor}.$((patch + 1))"
          if git rev-parse --verify "refs/tags/$next" >/dev/null 2>&1 || gh release view "$next" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to create $next: conflicting tag or release already exists." >&2
            exit 1
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "notes_start=$latest" >> "$GITHUB_OUTPUT"

      - name: Create weekly patch release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES_START: ${{ steps.release.outputs.notes_start }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --notes-start-tag "$NOTES_START"

      - name: Dispatch artifact release workflow
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" -f "tag=$TAG"
